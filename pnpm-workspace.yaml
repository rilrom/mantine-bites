packages:
  - apps/**/*
  - packages/**/*

overrides:
  "@mantine/core": "9.0.2"
  "@mantine/hooks": "9.0.2"

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAge: 10080

trustPolicy: no-downgrade
trustPolicyExclude:
  - css-declaration-sorter@6.4.1
  - semver@5.7.2
  - semver@6.3.1
  - undici-types@6.21.0
  - vite@6.4.1
